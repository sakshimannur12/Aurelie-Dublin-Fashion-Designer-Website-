<style>
  body {
    background-image: url('images/blur-bg.jpg');
    background-size: cover;
    background-attachment: fixed;
  }
  body::before {
    content: "";
    position: fixed;
    top: 0;

    height: 100%;

  <ul class="menu">

<header class="page-header">

</header>
<main class="wrapper">
  <div class="carousel-wrapper">
    <div class="carousel">
      <div class="carousel-item">
        <input type="checkbox" id="lightbox-g1" class="lightbox-toggle">
        <label for="lightbox-g1" class="lightbox-trigger">
          <img src="images/gallery_1.jpg" alt="Runway collection – flowing silk dress">
        </label>
        <div class="lightbox">
          <label for="lightbox-g1" class="lightbox-close">&times;</label>
          <img src="images/gallery_1.jpg" alt="Runway collection">
        </div>
      </div>
      <div class="carousel-item">
        <input type="checkbox" id="lightbox-g2" class="lightbox-toggle">
        <label for="lightbox-g2" class="lightbox-trigger">
          <img src="images/gallery_2.jpg" alt="Evening gown with Irish lace">
        </label>
        <div class="lightbox">
          <label for="lightbox-g2" class="lightbox-close">&times;</label>
          <img src="images/gallery_2.jpg" alt="Evening gown">
        </div>
      </div>
      <div class="carousel-item">
        <input type="checkbox" id="lightbox-g3" class="lightbox-toggle">
        <label for="lightbox-g3" class="lightbox-trigger">
          <img src="images/gallery_3.jpg" alt="Autumn/Winter tailored coat">

      <div class="carousel-item">

      </div>
      <div class="carousel-item">
        <input type="checkbox" id="lightbox-g5" class="lightbox-toggle">
        <label for="lightbox-g5" class="lightbox-trigger">
          <img src="images/gallery_5.jpg" alt="Spring collection pastel tones">
        </label>
        <div class="lightbox">
          <label for="lightbox-g5" class="lightbox-close">&times;</label>
          <img src="images/gallery_5.jpg" alt="Spring collection">
