<header class="page-header">
  <h2>Contact</h2>
</header>
<main class="wrapper">
  <div class="contact-wrapper">
    <div class="contact-info">
      <p><i class="fas fa-envelope"></i> info@aurelia.com</p>
      <p><i class="fas fa-map-marker-alt"></i> 12 St. Stephen's Green, Dublin 2, Ireland</p>
      <p><i class="fas fa-phone"></i> +353 (0)1 234 5678</p>
      <p><i class="fab fa-instagram"></i> @aurelia_dublin</p>
    </div>
    <form class="contact-form" action="#" method="post">
      <input type="text" name="name" placeholder="Your Name" required>
      <input type="email" name="email" placeholder="Your Email" required>
      <textarea name="message" placeholder="Your Message" rows="5" required></textarea>
      <button type="submit">Send Message</button>
    </form>
  </div>
</main>

  <div class="social-icons">
